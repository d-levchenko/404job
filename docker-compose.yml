services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - '3000:3000'

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ./apps/backend/.env
    ports:
      - '4000:4000'
